[package]
name = "codebook-core"
version.workspace = true
edition.workspace = true

[features]
default = []
native = ["dep:windows"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
zeroize.workspace = true
argon2 = "0.5"
aes-gcm = "0.10"
getrandom = "0.2"
url = "2"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
